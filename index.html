<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planetary Soundwaves - AI Art Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Orbitron:wght@900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lato', sans-serif;
            background: #000;
            color: #fff;
            overflow-x: hidden;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        header {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 2rem 1rem 1rem;
            background: linear-gradient(180deg, rgba(10,10,30,0.98) 0%, rgba(0,0,0,0) 100%);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.8rem;
            letter-spacing: 0.5rem;
            text-transform: uppercase;
            background: linear-gradient(45deg, #c4b5fd 0%, #fbbf24 50%, #f9a8d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            filter: drop-shadow(0 0 20px rgba(102, 126, 234, 0.6));
        }

        .subtitle {
            font-size: 0.9rem;
            color: #a5b4fc;
            letter-spacing: 0.15rem;
            margin-bottom: 0.5rem;
            font-weight: 300;
        }

        .container {
            position: relative;
            z-index: 5;
            max-width: 1800px;
            margin: 0 auto;
            padding: 0 2rem 2rem;
        }

        .solar-system-wrapper {
            width: 100%;
            max-width: 1400px;
            margin: 2rem auto;
            padding: 2rem;
            background: rgba(10,10,25,0.5);
            border-radius: 20px;
            border: 1px solid rgba(165,180,252,0.15);
        }

        .solar-system {
            position: relative;
            width: 100%;
            max-width: 1200px;
            height: 600px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .sun {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #fff5e1, #ffd700, #ffb347, #ff8c00, #ff6b35);
            box-shadow: 0 0 60px #ffa500, 0 0 90px #ff6347, 0 0 120px #ff4500;
            cursor: pointer;
            transition: all 0.4s ease;
            z-index: 100;
            animation: sunPulse 4s infinite;
        }

        .sun::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 30%, rgba(255,255,200,0.6), transparent 60%);
        }

        @keyframes sunPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .sun:hover {
            transform: scale(1.15) !important;
            box-shadow: 0 0 80px #ffa500, 0 0 120px #ff6347, 0 0 160px #ff4500;
        }

        .sun.active {
            box-shadow: 0 0 100px #ffa500, 0 0 140px #ff6347, 0 0 180px #ff4500;
        }

        .orbit {
            position: absolute;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 50%;
            pointer-events: none;
        }

        .planet-container {
            position: absolute;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .planet-container:hover {
            transform: translate(-50%, -50%) scale(1.2) !important;
            z-index: 50;
        }

        .planet-container.active {
            z-index: 60;
        }

        .planet {
            border-radius: 50%;
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.5);
            position: relative;
            background-size: cover !important;
            background-position: center !important;
        }

        .planet-label {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            white-space: nowrap;
            color: #a5b4fc;
            text-shadow: 0 0 10px rgba(165,180,252,0.5);
            pointer-events: none;
            font-weight: 300;
            letter-spacing: 0.05rem;
        }

        .planet-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150%;
            height: 150%;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .planet-container.active .planet-glow {
            opacity: 0.7;
        }

        .mercury { 
            width: 24px; 
            height: 24px;
            background: 
                radial-gradient(circle at 35% 30%, rgba(255,255,255,0.3), transparent 50%),
                radial-gradient(circle at 50% 50%, #9e9e9e, #7a7a7a, #5a5a5a, #3d3d3d);
            box-shadow: inset -4px -4px 10px rgba(0,0,0,0.7), 0 0 15px rgba(200,200,200,0.3);
        }
        .mercury-glow { background: radial-gradient(circle, rgba(184,184,184,0.6), transparent); }

        .venus { 
            width: 34px; 
            height: 34px;
            background: 
                radial-gradient(circle at 40% 30%, rgba(255,255,230,0.4), transparent 55%),
                radial-gradient(circle at 50% 50%, #f5deb3, #daa520, #cd853f, #a0522d);
            box-shadow: inset -5px -5px 12px rgba(0,0,0,0.5), 0 0 25px rgba(255,203,110,0.5);
        }
        .venus-glow { background: radial-gradient(circle, rgba(253,203,110,0.6), transparent); }

        .earth { 
            width: 36px; 
            height: 36px;
            background: 
                radial-gradient(circle at 40% 25%, rgba(255,255,255,0.5), transparent 40%),
                radial-gradient(ellipse at 30% 50%, #228b22 10%, transparent 25%),
                radial-gradient(ellipse at 60% 40%, #228b22 8%, transparent 22%),
                radial-gradient(circle at 50% 50%, #4a9eff, #2e86de, #1e5f99, #0a3d62);
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.6), 0 0 30px rgba(116,185,255,0.5);
        }
        .earth-glow { background: radial-gradient(circle, rgba(116,185,255,0.6), transparent); }

        .mars { 
            width: 28px; 
            height: 28px;
            background: 
                radial-gradient(circle at 38% 28%, rgba(255,200,180,0.4), transparent 50%),
                radial-gradient(circle at 50% 50%, #cd5c5c, #c04000, #8b0000, #5c0000);
            box-shadow: inset -4px -4px 12px rgba(0,0,0,0.6), 0 0 20px rgba(255,118,117,0.4);
        }
        .mars-glow { background: radial-gradient(circle, rgba(255,118,117,0.6), transparent); }

        .jupiter { 
            width: 80px; 
            height: 80px;
            background: 
                radial-gradient(circle at 35% 25%, rgba(255,255,240,0.3), transparent 45%),
                repeating-linear-gradient(
                    0deg,
                    #d2691e 0px, #d2691e 8px,
                    #daa520 8px, #daa520 15px,
                    #f4a460 15px, #f4a460 22px,
                    #cd853f 22px, #cd853f 30px,
                    #d2691e 30px, #d2691e 38px
                );
            border-radius: 50%;
            box-shadow: inset -8px -8px 25px rgba(0,0,0,0.5), 0 0 40px rgba(249,202,36,0.5);
        }
        .jupiter::before {
            content: '';
            position: absolute;
            width: 22%;
            height: 28%;
            background: radial-gradient(ellipse, rgba(200,50,40,0.8), rgba(150,30,20,0.6));
            top: 35%;
            left: 20%;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(200,50,40,0.4);
        }
        .jupiter-glow { background: radial-gradient(circle, rgba(249,202,36,0.6), transparent); }

        .saturn { 
            width: 70px; 
            height: 70px;
            background: 
                radial-gradient(circle at 38% 28%, rgba(255,255,230,0.4), transparent 50%),
                radial-gradient(circle at 50% 50%, #f4e4c1, #daa520, #cd853f, #a0522d);
            box-shadow: inset -6px -6px 18px rgba(0,0,0,0.5), 0 0 35px rgba(253,203,110,0.4);
        }
        .saturn::after {
            content: '';
            position: absolute;
            width: 150px;
            height: 30px;
            background: 
                repeating-linear-gradient(
                    0deg,
                    rgba(253,203,110,0.7) 0px, rgba(253,203,110,0.7) 2px,
                    rgba(200,150,80,0.6) 2px, rgba(200,150,80,0.6) 4px,
                    rgba(253,203,110,0.5) 4px, rgba(253,203,110,0.5) 6px,
                    rgba(180,130,70,0.4) 6px, rgba(180,130,70,0.4) 8px
                );
            border: 2px solid rgba(253,203,110,0.6);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotateX(75deg);
            box-shadow: 
                0 0 20px rgba(253,203,110,0.5),
                inset 0 0 15px rgba(0,0,0,0.4),
                0 8px 15px rgba(0,0,0,0.3);
        }
        .saturn-glow { background: radial-gradient(circle, rgba(253,203,110,0.6), transparent); }

        .uranus { 
            width: 52px; 
            height: 52px;
            background: 
                radial-gradient(circle at 40% 30%, rgba(200,255,255,0.4), transparent 55%),
                radial-gradient(circle at 50% 50%, #afeeee, #40e0d0, #20b2aa, #008b8b);
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.5), 0 0 28px rgba(129,236,236,0.5);
        }
        .uranus-glow { background: radial-gradient(circle, rgba(129,236,236,0.6), transparent); }

        .neptune { 
            width: 50px; 
            height: 50px;
            background: 
                radial-gradient(circle at 38% 28%, rgba(180,220,255,0.3), transparent 50%),
                radial-gradient(circle at 50% 50%, #4169e1, #1e90ff, #0000cd, #00008b);
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.6), 0 0 28px rgba(116,185,255,0.5);
        }
        .neptune-glow { background: radial-gradient(circle, rgba(116,185,255,0.6), transparent); }

        .visualization-area {
            position: relative;
            background: rgba(10,10,25,0.8);
            border: 2px solid rgba(165,180,252,0.2);
            border-radius: 20px;
            padding: 2rem;
            backdrop-filter: blur(10px);
            margin-top: 2rem;
        }

        .vis-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .vis-title {
            font-size: 1.4rem;
            color: #c4b5fd;
            letter-spacing: 0.1rem;
            font-weight: 400;
        }

        .controls {
            display: flex;
            gap: 0.8rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.7rem 1.2rem;
            border: 2px solid rgba(165,180,252,0.4);
            border-radius: 10px;
            background: rgba(30,30,50,0.8);
            color: #c4b5fd;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Lato', sans-serif;
            font-size: 0.9rem;
            font-weight: 400;
        }

        .btn:hover {
            border-color: #fbbf24;
            color: #fbbf24;
            box-shadow: 0 0 20px rgba(251,191,36,0.3);
            transform: translateY(-2px);
        }

        .btn.active {
            background: linear-gradient(135deg, #c4b5fd 0%, #fbbf24 100%);
            border-color: transparent;
            color: #1a1a2e;
        }

        #waveCanvas {
            width: 100%;
            height: 500px;
            border-radius: 15px;
            background: radial-gradient(ellipse at center, rgba(20,20,40,0.9) 0%, rgba(10,10,20,0.95) 100%);
        }

        .active-sounds {
            margin-top: 1.5rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .sound-tag {
            padding: 0.6rem 1.2rem;
            background: rgba(196,181,253,0.15);
            border: 2px solid rgba(196,181,253,0.3);
            border-radius: 20px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            color: #c4b5fd;
            transition: all 0.3s ease;
        }

        .sound-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }

        .remove-sound {
            cursor: pointer;
            opacity: 0.7;
            margin-left: 0.5rem;
        }

        .remove-sound:hover {
            opacity: 1;
            color: #fbbf24;
        }

        .info-panel {
            text-align: center;
            padding: 1.5rem;
            background: rgba(165,180,252,0.05);
            border-radius: 10px;
            color: #a5b4fc;
            font-size: 0.95rem;
            margin-top: 1.5rem;
            line-height: 1.6;
            font-weight: 300;
        }

        .ai-description {
            margin-top: 1.5rem;
            padding: 1.5rem;
            background: rgba(196,181,253,0.1);
            border: 2px solid rgba(196,181,253,0.3);
            border-radius: 15px;
            color: #c4b5fd;
            font-size: 0.95rem;
            line-height: 1.7;
            font-style: italic;
            min-height: 80px;
            display: none;
        }

        .ai-description.visible {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .loading-dots::after {
            content: '...';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        @media (max-width: 1024px) {
            .solar-system { height: 500px; }
            .sun { width: 100px; height: 100px; }
            .jupiter { width: 65px; height: 65px; }
            .saturn { width: 58px; height: 58px; }
            .uranus { width: 42px; height: 42px; }
            .neptune { width: 40px; height: 40px; }
            h1 { font-size: 2rem; letter-spacing: 0.3rem; }
        }

        .loading-status {
            text-align: center;
            padding: 1rem;
            color: #a5b4fc;
            font-size: 0.9rem;
            font-weight: 300;
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>

    <header>
        <h1>PLANETARY SOUNDWAVES</h1>
        <p class="subtitle">AI-Powered Sonic Geometry from the Solar System</p>
    </header>

    <div class="container">
        <div class="loading-status" id="loadingStatus">✓ Ready! Click planets to begin</div>
        
        <div class="solar-system-wrapper">
            <div class="solar-system" id="solarSystem">
                <div class="sun" onclick="toggleCelestial(0)" data-name="Sun" id="sunElement">
                    <div class="planet-label">SUN</div>
                </div>
            </div>
        </div>

        <div class="visualization-area">
            <div class="vis-header">
                <div class="vis-title">🌊 Sound Wave Geometry</div>
                <div class="controls">
                    <button class="btn" onclick="togglePause()" id="pauseBtn">⏸ Pause</button>
                    <button class="btn" onclick="captureArt()">📸 Capture</button>
                    <button class="btn" onclick="clearWaves()">🗑 Clear</button>
                    <button class="btn active" onclick="toggleGeometry()" id="geoBtn">Geometric</button>
                    <button class="btn" onclick="generateDescription()">✨ AI Describe</button>
                </div>
            </div>
            
            <canvas id="waveCanvas"></canvas>
            
            <div class="active-sounds" id="activeSounds"></div>

            <div class="ai-description" id="aiDescription"></div>
            
            <div class="info-panel">
                🎵 Click celestial bodies to layer sounds • Each planet creates unique, ever-evolving patterns • 📸 Capture pauses & saves high-quality PNG for tattoo reference
            </div>
        </div>
    </div>

    <script>
        const celestialData = [
            { 
                name: 'Sun', 
                frequency: 126.22, 
                color: '#ff8c00', 
                info: 'Solar oscillations',
                pattern: 'regal',
                strands: 12,
                turns: 4,
                waveStyle: 'majestic'
            },
            { 
                name: 'Mercury', 
                frequency: 144.72, 
                color: '#b8b8b8', 
                info: 'Solar wind interactions',
                pattern: 'spiral',
                strands: 3,
                turns: 5,
                waveStyle: 'tight'
            },
            { 
                name: 'Venus', 
                frequency: 221.23, 
                color: '#fdcb6e', 
                info: 'Atmospheric radio emissions',
                pattern: 'weave',
                strands: 6,
                turns: 3,
                waveStyle: 'flowing'
            },
            { 
                name: 'Earth', 
                frequency: 194.18, 
                color: '#74b9ff', 
                info: 'Magnetospheric chorus',
                pattern: 'orbital',
                strands: 5,
                turns: 4,
                waveStyle: 'orbital'
            },
            { 
                name: 'Mars', 
                frequency: 144.72, 
                color: '#ff7675', 
                info: 'Wind and atmospheric pressure',
                pattern: 'angular',
                strands: 4,
                turns: 6,
                waveStyle: 'sharp'
            },
            { 
                name: 'Jupiter', 
                frequency: 183.58, 
                color: '#f9ca24', 
                info: 'Radio emissions and auroras',
                pattern: 'vortex',
                strands: 12,
                turns: 4,
                waveStyle: 'chaotic'
            },
            { 
                name: 'Saturn', 
                frequency: 147.85, 
                color: '#fdcb6e', 
                info: 'Kilometric radiation',
                pattern: 'rings',
                strands: 10,
                turns: 2,
                waveStyle: 'circular'
            },
            { 
                name: 'Uranus', 
                frequency: 207.36, 
                color: '#81ecec', 
                info: 'Magnetic field oscillations',
                pattern: 'tilted',
                strands: 7,
                turns: 3,
                waveStyle: 'eccentric'
            },
            { 
                name: 'Neptune', 
                frequency: 211.44, 
                color: '#74b9ff', 
                info: 'Plasma wave emissions',
                pattern: 'waves',
                strands: 8,
                turns: 4,
                waveStyle: 'ocean'
            }
        ];

        const planetPositions = [
            { x: 160, y: 0 },
            { x: 220, y: -60 },
            { x: 280, y: 0 },
            { x: 210, y: 100 },
            { x: 380, y: -40 },
            { x: -320, y: 60 },
            { x: -420, y: 120 },
            { x: -380, y: -80 }
        ];

        let canvas, ctx, audioContext;
        let activeSounds = [];
        let geometricMode = true;
        let animationId;
        let isPaused = false;

        async function init() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 200; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                starsContainer.appendChild(star);
            }

            const solarSystem = document.getElementById('solarSystem');
            const loadingStatus = document.getElementById('loadingStatus');

            setTimeout(() => loadingStatus.style.display = 'none', 3000);
            
            planetPositions.forEach((pos, idx) => {
                const planetIndex = idx + 1;
                const container = document.createElement('div');
                container.className = 'planet-container';
                container.style.left = `calc(50% + ${pos.x}px)`;
                container.style.top = `calc(50% + ${pos.y}px)`;
                container.style.transform = 'translate(-50%, -50%)';
                container.onclick = () => toggleCelestial(planetIndex);

                const planetName = celestialData[planetIndex].name.toLowerCase();
                
                const glowDiv = document.createElement('div');
                glowDiv.className = `planet-glow ${planetName}-glow`;

                const planetDiv = document.createElement('div');
                planetDiv.className = `planet ${planetName}`;

                const labelDiv = document.createElement('div');
                labelDiv.className = 'planet-label';
                labelDiv.textContent = celestialData[planetIndex].name.toUpperCase();

                container.appendChild(glowDiv);
                container.appendChild(planetDiv);
                container.appendChild(labelDiv);
                
                solarSystem.appendChild(container);
            });

            canvas = document.getElementById('waveCanvas');
            ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth * 2;
            canvas.height = canvas.offsetHeight * 2;
            canvas.style.width = canvas.offsetWidth / 2 + 'px';
            canvas.style.height = canvas.offsetHeight / 2 + 'px';

            window.addEventListener('resize', () => {
                const w = canvas.offsetWidth;
                const h = canvas.offsetHeight;
                canvas.width = w * 2;
                canvas.height = h * 2;
                canvas.style.width = w + 'px';
                canvas.style.height = h + 'px';
            });

            startVisualization();
        }

        function toggleCelestial(index) {
            const body = celestialData[index];
            const existingIndex = activeSounds.findIndex(s => s.name === body.name);

            if (existingIndex !== -1) {
                if (activeSounds[existingIndex].oscillator) {
                    activeSounds[existingIndex].oscillator.stop();
                    activeSounds[existingIndex].lfo.stop();
                }
                activeSounds.splice(existingIndex, 1);
                
                if (index === 0) {
                    document.querySelector('.sun').classList.remove('active');
                } else {
                    const containers = document.querySelectorAll('.planet-container');
                    containers[index - 1].classList.remove('active');
                }
            } else {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }

                const analyser = audioContext.createAnalyser();
                analyser.fftSize = 2048;
                
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.type = 'sine';
                oscillator.frequency.value = body.frequency;
                
                const lfo = audioContext.createOscillator();
                lfo.frequency.value = 0.15 + Math.random() * 0.25;
                const lfoGain = audioContext.createGain();
                lfoGain.gain.value = 8 + Math.random() * 12;
                
                lfo.connect(lfoGain);
                lfoGain.connect(oscillator.frequency);
                oscillator.connect(gainNode);
                gainNode.connect(analyser);
                analyser.connect(audioContext.destination);
                gainNode.gain.value = 0.12;
                
                oscillator.start();
                lfo.start();

                activeSounds.push({
                    name: body.name,
                    frequency: body.frequency,
                    color: body.color,
                    pattern: body.pattern,
                    strands: body.strands,
                    turns: body.turns,
                    waveStyle: body.waveStyle,
                    oscillator: oscillator,
                    lfo: lfo,
                    analyser: analyser,
                    phase: Math.random() * Math.PI * 2,
                    rotationSpeed: 0.002 + Math.random() * 0.004,
                    flowOffset: Math.random() * 100
                });

                if (index === 0) {
                    document.querySelector('.sun').classList.add('active');
                } else {
                    const containers = document.querySelectorAll('.planet-container');
                    containers[index - 1].classList.add('active');
                }
            }

            updateActiveSoundsDisplay();
        }

        function updateActiveSoundsDisplay() {
            const container = document.getElementById('activeSounds');
            container.innerHTML = '';
            
            activeSounds.forEach(sound => {
                const tag = document.createElement('div');
                tag.className = 'sound-tag';
                tag.innerHTML = `
                    <div class="sound-indicator" style="background: ${sound.color};"></div>
                    <span>${sound.name}</span>
                    <span class="remove-sound" onclick="removeSoundByName('${sound.name}')">✕</span>
                `;
                container.appendChild(tag);
            });
        }

        function removeSoundByName(name) {
            const index = celestialData.findIndex(c => c.name === name);
            if (index !== -1) {
                toggleCelestial(index);
            }
        }

        function drawPatternForPlanet(sound, idx, time, centerX, centerY) {
            const dataArray = new Uint8Array(sound.analyser.frequencyBinCount);
            sound.analyser.getByteTimeDomainData(dataArray);

            ctx.strokeStyle = sound.color;
            ctx.shadowBlur = 6;
            ctx.shadowColor = sound.color;

            switch(sound.pattern) {
                case 'regal':
                    drawRegalPattern(sound, dataArray, centerX, centerY, idx, time);
                    break;
                case 'spiral':
                    drawSpiralPattern(sound, dataArray, centerX, centerY, idx, time);
                    break;
                case 'weave':
                    drawWeavePattern(sound, dataArray, centerX, centerY, idx, time);
                    break;
                case 'orbital':
                    drawOrbitalPattern(sound, dataArray, centerX, centerY, idx, time);
                    break;
                case 'angular':
                    drawAngularPattern(sound, dataArray, centerX, centerY, idx, time);
                    break;
                case 'vortex':
                    drawVortexPattern(sound, dataArray, centerX, centerY, idx, time);
                    break;
                case 'rings':
                    drawRingsPattern(sound, dataArray, centerX, centerY, idx, time);
                    break;
                case 'tilted':
                    drawTiltedPattern(sound, dataArray, centerX, centerY, idx, time);
                    break;
                case 'waves':
                    drawWavesPattern(sound, dataArray, centerX, centerY, idx, time);
                    break;
            }
        }

        function drawRegalPattern(sound, data, centerX, centerY, idx, time) {
            ctx.lineWidth = 1.2;
            const rays = sound.strands;
            const baseRadius = 150 + idx * 75;
            
            // Organic flowing rays - Sun's warm expansive energy
            for (let ray = 0; ray < rays; ray++) {
                ctx.globalAlpha = 0.48 - ray * 0.03;
                ctx.beginPath();
                
                for (let i = 0; i < data.length; i += 2) {
                    const v = (data[i] / 128.0 - 1);
                    const t = i / data.length;
                    const angle = sound.phase + t * Math.PI * 2;
                    
                    // Warm, expansive solar flows - slower, broader waves
                    const solarFlow1 = Math.sin(t * 8 + time * 1.5 + ray * 0.6) * 55;
                    const solarFlow2 = Math.cos(t * 12 - time * 1.0 + ray * 0.8) * 42;
                    const solarFlow3 = Math.sin(t * 5 + time * 0.7 + ray * 0.4) * 32;
                    
                    const radius = baseRadius + v * 80 + solarFlow1 + solarFlow2 + solarFlow3;
                    
                    const px = centerX + Math.cos(angle) * radius;
                    const py = centerY + Math.sin(angle) * radius;
                    
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.stroke();
            }
            
            ctx.globalAlpha = 1;
        }

        function drawSpiralPattern(sound, data, centerX, centerY, idx, time) {
            ctx.lineWidth = 1.3;
            const spirals = sound.strands;
            
            for (let spiral = 0; spiral < spirals; spiral++) {
                ctx.globalAlpha = 0.6 - spiral * 0.05;
                ctx.beginPath();
                
                const direction = spiral % 2 === 0 ? 1 : -1;
                const spiralOffset = (spiral / spirals) * Math.PI * 0.5;
                
                for (let i = 0; i < data.length; i += 2) {
                    const v = (data[i] / 128.0 - 1);
                    const t = i / data.length;
                    
                    const angle = sound.phase + spiralOffset + direction * t * Math.PI * sound.turns * 2;
                    const baseRadius = 120 + idx * 70 + t * 200;
                    const tightWave = Math.sin(t * 20 + time * 2) * 15;
                    const radius = baseRadius + v * 80 + tightWave;
                    
                    const px = centerX + Math.cos(angle) * radius;
                    const py = centerY + Math.sin(angle) * radius;
                    
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.stroke();
            }
            ctx.globalAlpha = 1;
        }

        function drawWeavePattern(sound, data, centerX, centerY, idx, time) {
            ctx.lineWidth = 1.2;
            const strands = sound.strands;
            const baseRadius = 160 + idx * 75;
            
            for (let strand = 0; strand < strands; strand++) {
                ctx.globalAlpha = 0.45 + (strand % 2) * 0.1;
                ctx.beginPath();
                
                const strandOffset = (strand / strands) * Math.PI * 2;
                const direction = strand % 2 === 0 ? 1 : -1;
                
                for (let i = 0; i < data.length; i += 2) {
                    const v = (data[i] / 128.0 - 1) * 0.6;
                    const t = i / data.length;
                    
                    const angle = sound.phase + strandOffset + direction * t * Math.PI * sound.turns;
                    
                    const weave1 = Math.sin(t * 8 + time + strand * 0.8) * 50;
                    const weave2 = Math.cos(t * 12 - time * 0.7 + strand) * 35;
                    
                    const radius = baseRadius + v * 90 + weave1 + weave2;
                    
                    const px = centerX + Math.cos(angle) * radius;
                    const py = centerY + Math.sin(angle) * radius;
                    
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.stroke();
            }
            ctx.globalAlpha = 1;
        }

        function drawOrbitalPattern(sound, data, centerX, centerY, idx, time) {
            ctx.lineWidth = 1.3;
            const orbits = sound.strands;
            
            for (let orbit = 0; orbit < orbits; orbit++) {
                ctx.globalAlpha = 0.5;
                ctx.beginPath();
                
                const orbitPhase = sound.phase + (orbit / orbits) * Math.PI * 2;
                
                for (let i = 0; i < data.length; i += 2) {
                    const v = (data[i] / 128.0 - 1);
                    const t = i / data.length;
                    
                    const angle = orbitPhase + t * Math.PI * 2;
                    const eccentric = 1 + Math.sin(angle * sound.turns + time) * 0.4;
                    
                    const baseRadius = 140 + idx * 70 + orbit * 35;
                    const orbitWave = Math.sin(t * 10 + time * 1.2 + orbit) * 25;
                    const radius = baseRadius * eccentric + v * 70 + orbitWave;
                    
                    const px = centerX + Math.cos(angle) * radius;
                    const py = centerY + Math.sin(angle) * radius;
                    
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.stroke();
            }
            ctx.globalAlpha = 1;
        }

        function drawAngularPattern(sound, data, centerX, centerY, idx, time) {
            ctx.lineWidth = 1.4;
            const points = sound.strands;
            const layers = 3;
            
            for (let layer = 0; layer < layers; layer++) {
                ctx.globalAlpha = 0.55 - layer * 0.1;
                ctx.beginPath();
                
                for (let point = 0; point <= points; point++) {
                    const angle = sound.phase + (point / points) * Math.PI * 2 + layer * 0.3;
                    const sampleIdx = Math.floor((point / points) * data.length);
                    const v = (data[sampleIdx] / 128.0 - 1);
                    
                    const baseRadius = 155 + idx * 75 + layer * 50;
                    const sharpWave = Math.sin(point * sound.turns + time * 1.5) * 40;
                    const radius = baseRadius + v * 85 + sharpWave;
                    
                    const px = centerX + Math.cos(angle) * radius;
                    const py = centerY + Math.sin(angle) * radius;
                    
                    if (point === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.stroke();
            }
            ctx.globalAlpha = 1;
        }

        function drawVortexPattern(sound, data, centerX, centerY, idx, time) {
            ctx.lineWidth = 1.0;
            const arms = sound.strands;
            
            for (let arm = 0; arm < arms; arm++) {
                ctx.globalAlpha = 0.4;
                ctx.beginPath();
                
                const armOffset = (arm / arms) * Math.PI * 2;
                
                for (let i = 0; i < data.length; i += 2) {
                    const v = (data[i] / 128.0 - 1);
                    const t = i / data.length;
                    
                    const spiralAngle = sound.phase + armOffset + t * Math.PI * sound.turns * 1.5;
                    const baseRadius = 100 + t * 250;
                    
                    const chaos1 = Math.sin(t * 12 + time * 1.5 + arm * 0.5) * 30;
                    const chaos2 = Math.cos(t * 8 - time + arm * 0.8) * 20;
                    
                    const radius = baseRadius + v * 90 + chaos1 + chaos2;
                    
                    const px = centerX + Math.cos(spiralAngle) * radius;
                    const py = centerY + Math.sin(spiralAngle) * radius;
                    
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.stroke();
            }
            ctx.globalAlpha = 1;
        }

        function drawRingsPattern(sound, data, centerX, centerY, idx, time) {
            ctx.lineWidth = 1.2;
            const rings = sound.strands;
            
            for (let ring = 0; ring < rings; ring++) {
                ctx.globalAlpha = 0.45 + (ring % 2) * 0.15;
                ctx.beginPath();
                
                for (let i = 0; i < data.length; i += 2) {
                    const v = (data[i] / 128.0 - 1);
                    const t = i / data.length;
                    const angle = sound.phase + t * Math.PI * 2;
                    
                    const baseRadius = 130 + idx * 70 + ring * 30;
                    const ringWave = Math.sin(t * 25 + time * 1.5 + ring) * 20;
                    const circularFlow = Math.cos(t * 15 - time + ring * 0.5) * 15;
                    
                    const radius = baseRadius + v * 70 + ringWave + circularFlow;
                    
                    const px = centerX + Math.cos(angle) * radius;
                    const py = centerY + Math.sin(angle) * radius;
                    
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.stroke();
            }
            ctx.globalAlpha = 1;
        }

        function drawTiltedPattern(sound, data, centerX, centerY, idx, time) {
            ctx.lineWidth = 1.3;
            const layers = sound.strands;
            const tiltAngle = Math.PI / 3;
            
            for (let layer = 0; layer < layers; layer++) {
                ctx.globalAlpha = 0.5 - layer * 0.04;
                ctx.beginPath();
                
                for (let i = 0; i < data.length; i += 2) {
                    const v = (data[i] / 128.0 - 1);
                    const t = i / data.length;
                    const angle = sound.phase + t * Math.PI * 2;
                    
                    const baseRadius = 145 + idx * 70 + layer * 30;
                    const tiltEffect = Math.cos(angle + tiltAngle) * 45;
                    const eccentricWave = Math.sin(t * 15 + time + layer * 0.7) * 28;
                    
                    const radius = baseRadius + v * 75 + tiltEffect + eccentricWave;
                    
                    const px = centerX + Math.cos(angle) * radius;
                    const py = centerY + Math.sin(angle) * radius * 0.65;
                    
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.stroke();
            }
            ctx.globalAlpha = 1;
        }

        function drawWavesPattern(sound, data, centerX, centerY, idx, time) {
            ctx.lineWidth = 1.2;
            const waves = sound.strands;
            
            for (let wave = 0; wave < waves; wave++) {
                ctx.globalAlpha = 0.48 - wave * 0.03;
                ctx.beginPath();
                
                for (let i = 0; i < data.length; i += 2) {
                    const v = (data[i] / 128.0 - 1);
                    const t = i / data.length;
                    const angle = sound.phase + t * Math.PI * 2;
                    
                    const baseRadius = 150 + idx * 75 + wave * 25;
                    
                    // Match Sun's exact wave structure with Neptune's mystical variations
                    const wave1 = Math.sin(t * 10 + time * 1.8 + wave * 0.6) * 45;
                    const wave2 = Math.cos(t * 15 - time * 1.2 + wave * 0.9) * 35;
                    const wave3 = Math.sin(t * 7 + time * 0.9 + wave * 0.4) * 25;
                    
                    const radius = baseRadius + v * 80 + wave1 + wave2 + wave3;
                    
                    const px = centerX + Math.cos(angle) * radius;
                    const py = centerY + Math.sin(angle) * radius;
                    
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.stroke();
            }
            ctx.globalAlpha = 1;
        }

        function startVisualization() {
            function animate() {
                if (!isPaused) {
                    ctx.fillStyle = 'rgba(10, 10, 20, 0.06)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    const time = Date.now() * 0.001;
                    const centerX = canvas.width / 2;
                    const centerY = canvas.height / 2;

                    activeSounds.forEach((sound, idx) => {
                        if (geometricMode) {
                            drawPatternForPlanet(sound, idx, time, centerX, centerY);
                        } else {
                            const dataArray = new Uint8Array(sound.analyser.frequencyBinCount);
                            sound.analyser.getByteTimeDomainData(dataArray);

                            ctx.strokeStyle = sound.color;
                            ctx.lineWidth = 2;
                            ctx.shadowBlur = 15;
                            ctx.shadowColor = sound.color;
                            ctx.globalAlpha = 0.8;

                            ctx.beginPath();
                            const sliceWidth = canvas.width / dataArray.length;
                            let x = 0;
                            
                            for (let i = 0; i < dataArray.length; i++) {
                                const v = dataArray[i] / 128.0;
                                const organicWave = Math.sin((i * 0.02 + time) * (1 + idx * 0.3)) * 40;
                                const y = (v * canvas.height / 3) + (idx * 160) + organicWave;

                                if (i === 0) ctx.moveTo(x, y);
                                else ctx.lineTo(x, y);

                                x += sliceWidth;
                            }
                            ctx.stroke();
                            ctx.globalAlpha = 1;
                        }

                        ctx.shadowBlur = 0;
                        sound.phase += sound.rotationSpeed;
                    });
                }

                animationId = requestAnimationFrame(animate);
            }

            animate();
        }

        function togglePause() {
            isPaused = !isPaused;
            const btn = document.getElementById('pauseBtn');
            btn.textContent = isPaused ? '▶ Play' : '⏸ Pause';
            btn.classList.toggle('active', isPaused);
        }

        function captureArt() {
            const wasPaused = isPaused;
            if (!wasPaused) {
                isPaused = true;
            }
            
            setTimeout(() => {
                const link = document.createElement('a');
                const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
                link.download = `planetary-soundwaves-${timestamp}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                const btn = document.querySelector('button[onclick="captureArt()"]');
                const originalText = btn.textContent;
                btn.textContent = '✓ Saved!';
                btn.classList.add('active');
                
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.remove('active');
                    if (!wasPaused) {
                        isPaused = false;
                    }
                }, 1500);
            }, 100);
        }

        function clearWaves() {
            activeSounds.forEach(sound => {
                if (sound.oscillator) sound.oscillator.stop();
                if (sound.lfo) sound.lfo.stop();
            });
            
            activeSounds = [];
            
            document.querySelector('.sun').classList.remove('active');
            document.querySelectorAll('.planet-container').forEach(container => {
                container.classList.remove('active');
            });
            
            ctx.fillStyle = 'rgba(10, 10, 20, 1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            updateActiveSoundsDisplay();
        }

        function toggleGeometry() {
            geometricMode = !geometricMode;
            const btn = document.getElementById('geoBtn');
            btn.textContent = geometricMode ? 'Geometric' : 'Wave';
            btn.classList.toggle('active', geometricMode);
        }

        async function generateDescription() {
            if (activeSounds.length === 0) {
                alert('Please activate at least one planet first!');
                return;
            }

            const descBox = document.getElementById('aiDescription');
            descBox.classList.add('visible');
            descBox.innerHTML = '<span class="loading-dots">Consulting the cosmos</span>';

            const planetNames = activeSounds.map(s => s.name.toLowerCase()).join(', ');
            
            try {
                const today = new Date();
                const day = 'today';
                
                const zodiacSigns = ['aries', 'taurus', 'gemini', 'cancer', 'leo', 'virgo', 
                                    'libra', 'scorpio', 'sagittarius', 'capricorn', 'aquarius', 'pisces'];
                const randomSign = zodiacSigns[Math.floor(Math.random() * zodiacSigns.length)];
                
                const response = await fetch(`https://aztro.sameerkumar.website/?sign=${randomSign}&day=${day}`, {
                    method: 'POST'
                });

                const data = await response.json();
                
                if (data.description) {
                    const interpretation = createCosmicInterpretation(activeSounds, data);
                    descBox.innerHTML = `🌟 <strong>Cosmic Alignment</strong><br><br>${interpretation}`;
                } else {
                    const fallbackInterpretation = createLocalInterpretation(activeSounds);
                    descBox.innerHTML = `🌟 <strong>Planetary Resonance</strong><br><br>${fallbackInterpretation}`;
                }
            } catch (error) {
                console.error('API Error:', error);
                const fallbackInterpretation = createLocalInterpretation(activeSounds);
                descBox.innerHTML = `🌟 <strong>Planetary Resonance</strong><br><br>${fallbackInterpretation}`;
            }
        }

        function createCosmicInterpretation(sounds, horoscopeData) {
            const planetMeanings = {
                'Sun': 'life force and vitality',
                'Mercury': 'communication and intellect',
                'Venus': 'love and beauty',
                'Earth': 'grounding and stability',
                'Mars': 'action and courage',
                'Jupiter': 'expansion and wisdom',
                'Saturn': 'discipline and structure',
                'Uranus': 'innovation and change',
                'Neptune': 'dreams and intuition'
            };

            const planetList = sounds.map(s => `${s.name} (${planetMeanings[s.name] || 'cosmic energy'})`).join(', ');
            
            return `The celestial bodies ${planetList} converge in your soundscape, creating a powerful cosmic resonance. ${horoscopeData.description} Your lucky number is ${horoscopeData.lucky_number}, and your mood is ${horoscopeData.mood}. This planetary alignment vibrates at frequencies that harmonize with your cosmic journey.`;
        }

        function createLocalInterpretation(sounds) {
            const planetMeanings = {
                'Sun': { energy: 'radiant life force', quality: 'illuminating consciousness' },
                'Mercury': { energy: 'swift communication', quality: 'intellectual clarity' },
                'Venus': { energy: 'harmonious beauty', quality: 'loving attraction' },
                'Earth': { energy: 'grounded stability', quality: 'nurturing foundation' },
                'Mars': { energy: 'dynamic action', quality: 'courageous will' },
                'Jupiter': { energy: 'expansive wisdom', quality: 'abundant growth' },
                'Saturn': { energy: 'structured discipline', quality: 'karmic lessons' },
                'Uranus': { energy: 'revolutionary change', quality: 'awakened consciousness' },
                'Neptune': { energy: 'mystical dreams', quality: 'spiritual transcendence' }
            };

            if (sounds.length === 1) {
                const planet = sounds[0].name;
                const meaning = planetMeanings[planet];
                return `${planet} resonates alone in your cosmic space, channeling pure ${meaning.energy} through ${meaning.quality}. This singular frequency creates a focused meditation on the essence of ${planet.toLowerCase()}'s archetypal power.`;
            } else if (sounds.length === 2) {
                const p1 = sounds[0].name;
                const p2 = sounds[1].name;
                const m1 = planetMeanings[p1];
                const m2 = planetMeanings[p2];
                return `${p1} and ${p2} form a celestial duet—${m1.energy} dances with ${m2.energy}, creating a sacred geometry where ${m1.quality} meets ${m2.quality}. This harmonic convergence bridges cosmic polarities into unified resonance.`;
            } else {
                const planetList = sounds.map(s => s.name).join(', ');
                const primaryPlanet = sounds[0].name;
                const meaning = planetMeanings[primaryPlanet];
                return `A cosmic symphony of ${planetList} weaves through the celestial sphere. Led by ${primaryPlanet}'s ${meaning.energy}, these planetary frequencies create a mandala of sound—each body contributing its unique vibrational signature to form a transcendent whole. Your tattoo will capture this moment of perfect cosmic alignment.`;
            }
        }

        window.addEventListener('load', init);
    </script>
